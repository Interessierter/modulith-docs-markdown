project:
  name: modulith-docs-markdown
  description: Documents a Spring Modulith application as Docusaurus-flavoured Markdown with Mermaid diagrams
  longDescription: |
    modulith-docs-markdown renders a Spring Modulith application's ApplicationModules as Docusaurus-flavoured
    Markdown with Mermaid diagrams, carrying the same semantic information as Spring Modulith's built-in
    Documenter (AsciiDoc + PlantUML). A semantic parity test runs both tools over the same model and asserts
    they document the same facts and diagram topology.
  links:
    homepage: https://github.com/haisi/modulith-docs-markdown
  authors:
    - Hasan Selman Kara
  license: Apache-2.0
  inceptionYear: "2026"
  languages:
    java:
      groupId: li.selman
      version: "25"

release:
  github:
    owner: haisi
    name: modulith-docs-markdown
    overwrite: true
    changelog:
      formatted: ALWAYS
      preset: conventional-commits

signing:
  active: ALWAYS
  pgp:
    armored: true

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - target/staging-deploy
        applyMavenCentralRules: true
